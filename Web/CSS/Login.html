<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./Login.css">
    <link rel="stylesheet" href="https://cloudflare.com">

</head>

<body>
    <section id="main-container">

        <article id="login-box">
            <img src="https://img.freepik.com/free-vector/minimal-mountain-landscape-shades-blue_1048-20252.jpg?semt=ais_hybrid&w=740&q=80"
                alt="Innner imgaes" id="innerimg">
            <div id="login-form">
                <h3>Login Form</h3>
                <div class="inputs">
                    <img src="https://png.pngtree.com/png-vector/20190909/ourmid/pngtree-outline-user-icon-png-image_1727916.jpg"
                        alt="user icon" class="icon">
                    <input type="text" name="username" id="username" placeholder="Username">
                </div>
                <div class="inputs">
                    <img src="https://www.clipartmax.com/png/middle/421-4210885_lock-svg-png-icon-free-download-free-lock-icon-png.png"
                        alt="Lock icon" class="icon">
                    <input type="password" name="pass" id="password" placeholder="Enter Password">
                </div>
                <div id="btn-forgot">
                    <input type="checkbox" role="switch" id="">
                    <label for="">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <div><button id="login-btn">Login</button></div>
            </div>

        </article>

    </section>


</body>

</html>
