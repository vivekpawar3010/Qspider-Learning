<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedKit UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <main id="mainbox">

        <section id="leftside">

            <header id="header">

                <p id="logo">
                    MedKit
                </p>

            </header>

            <section id="content">

                <p id="maintext">
                    Connect with top rated doctors in just a few clicks
                </p>

                <p id="subtitle">
                    Select your doctor and preferred time slot to book your appointment
                </p>

                <div id="appointbox">

                    <p id="appointtitle">
                        Book your appointment
                    </p>

                    <div id="inputs">

                        <div class="inputbox">

                            <select>

                                <option selected disabled>
                                    Specialty
                                </option>

                                <option>
                                    Cardiologist
                                </option>

                                <option>
                                    Dentist
                                </option>

                                <option>
                                    Neurologist
                                </option>

                                <option>
                                    Dermatologist
                                </option>

                            </select>

                            <i class="fa-solid fa-angle-down"></i>

                        </div>

                        <div class="inputbox">

                            <input type="text" placeholder="Location">

                            <i class="fa-solid fa-location-dot"></i>

                        </div>

                        <div class="inputbox">

                            <input type="date">

                            <i class="fa-regular fa-calendar"></i>

                        </div>

                        <button id="searchbtn">
                            Search
                        </button>

                    </div>

                </div>

            </section>

        </section>

        <section id="rightside">

            <nav id="navbar">

                <a href="#">
                    Home
                </a>

                <a href="#">
                    Find a doctor
                </a>

                <a href="#">
                    About us
                </a>

                <button id="clientbtn">
                    Client Area
                </button>

            </nav>

            <section id="doctorsection">

                <div id="circlebg"></div>

                <img src="" alt="Doctor Image">

                <div class="floatingcard card1">

                    <i class="fa-regular fa-face-smile"></i>

                    <div>

                        <p class="cardtitle">
                            200,000+
                        </p>

                        <p class="cardinfo">
                            Registered Patients
                        </p>

                    </div>

                </div>

                <div class="floatingcard card2">

                    <i class="fa-solid fa-stethoscope"></i>

                    <div>

                        <p class="cardtitle">
                            5,000+
                        </p>

                        <p class="cardinfo">
                            Doctors Online
                        </p>

                    </div>

                </div>

                <div class="floatingcard card3">

                    <i class="fa-solid fa-heart"></i>

                    <div>

                        <p class="cardtitle">
                            Join Today!
                        </p>

                    </div>

                </div>

                <div class="floatingcard card4">

                    <i class="fa-solid fa-star"></i>

                    <div>

                        <p class="cardtitle">
                            #1 Worldwide
                        </p>

                        <p class="cardinfo">
                            Medical Website
                        </p>

                    </div>

                </div>

            </section>

        </section>

    </main>

</body>

</html>
